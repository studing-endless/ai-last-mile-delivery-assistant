  <rect x="353" y="232" width="254" height="75" rx="10" fill="#1d4838"/>
  <text x="480" y="263" text-anchor="middle" font-size="20" font-weight="700" fill="#fffef9">Streamlit 工作台</text>
  <text x="480" y="287" text-anchor="middle" font-size="15" fill="#e2eee3">查看对比、管理规划快照</text>
  <path class="flow" d="M378 308v17H152v37"/>
